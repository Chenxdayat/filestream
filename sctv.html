 }

    <style>

<!-- Plyr.js CDN -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<video id="player" controls crossorigin playsinline controls poster="https://bit.ly/3PJhGz7">
    <source src="https://cdn09jtedge.indihometv.com/atm/hlsv3/sctv/index.m3u8?c" type="video/mp4">
</video>

<script>
    const player = new Plyr('#player');
</script>
  
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const player = new Plyr("#player");

        // Buat elemen logo
        const logo = document.createElement("img");
        logo.src = "https://bit.ly/3PJhGz7"; 
        logo.style.position = "absolute";
        logo.style.bottom = "20px";
        logo.style.right = "20px";
        logo.style.width = "70px";
        logo.style.opacity = "0.8";
        logo.style.zIndex = "10";

        // Tambahkan ke video wrapper
        document.querySelector(".plyr").appendChild(logo);
    });
</script>

<script>
    const player = new Plyr('#player', {
        fullscreen: { enabled: true, fallback: true, iosNative: true },
        autoplay: true,
        muted: false, // Autoplay di browser modern membutuhkan video dalam keadaan mute
        controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
    });
</script>

  
<style>
/* Atur video agar full layar */
.video-container {
    position: fixed; /* Agar menempel pada layar */

    z-index: 9999; /* Prioritas tampil */
