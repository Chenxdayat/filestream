<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>ChenxDayat Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000;
        height: 100%;
        font-family: Arial, sans-serif;
      }

      .header {
        display: flex;
        align-items: center;
        padding: 10px;
        background-color: #111;
        color: white;
      }

      .header img {
        height: 40px;
        margin-right: 10px;
      }

      .header-title {
        font-size: 18px;
        font-weight: bold;
      }

      #video {
        width: 100%;
        height: calc(100vh - 60px);
        background-color: #000;
        object-fit: contain;
      }

      .info {
        color: #fff;
        text-align: center;
        padding: 20px;
        display: none;
      }

      #poster {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        height: calc(100vh - 60px);
        background: url('https://bit.ly/3PJhGz7') center center no-repeat;
        background-size: cover;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="https://i.imgur.com/fj8ZbSx.png" alt="ChenxDayat Logo" />
      <div class="header-title">ChenxDayat TV Player</div>
    </div>

    <div id="poster"></div>
    <video id="video" controls autoplay poster="https://i.imgur.com/sXG2r8x.jpg"></video>
    <div class="info" id="info">Tidak ada URL streaming ditemukan</div>

    <script>
      function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      const video = document.getElementById("video");
      const info = document.getElementById("info");
      const poster = document.getElementById("poster");
      const fileUrl = getQueryParam("file");

      if (fileUrl) {
        poster.style.display = "none";
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(fileUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.play();
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = fileUrl;
          video.addEventListener("loadedmetadata", function () {
            video.play();
          });
        } else {
          info.innerText = "Browser tidak mendukung streaming HLS (.m3u8)";
          info.style.display = "block";
        }
      } else {
        video.style.display = "none";
        info.style.display = "block";
      }
    </script>
  </body>
</html>
